openapi: 3.0.1
info:
  title: DTO Schema
  version: 1.0.0

paths: {}

components:
  schemas:
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
        - token
        - username
        - roles

    Role:
      type: string
      enum:
        - USER
        - ADMIN
        - MODERATOR
