spring:
  application:
    name: jwt-security

  datasource:
    url: jdbc:postgresql://localhost:5432/jwt_security
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ##redis configuration
  data:
    redis:
      host: localhost
      port: 6379
rate:
  limiter:
    bucket-capacity: 10
    refill-tokens: 5
    refill-interval-minutes: 1  # 1 minute




